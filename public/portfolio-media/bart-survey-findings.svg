<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="t d">
<title id="t">BART rider research — 2019 survey findings</title>
<desc id="d">A rebuilt text-led overview based only on readable findings from the archived 2019 BART fare-gate project survey. The top three concerns were safety, cleanliness and smell. The survey included a wide age range, many daytime riders, and an often average or poor reported riding experience. No percentages are invented.</desc>
<rect width="1600" height="930" fill="#ffffff"/>
<rect width="14" height="930" fill="#0072FC"/>
<text x="94" y="112" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0072fc" letter-spacing="3.2">BART / RIDER RESEARCH</text>
<text x="94" y="200" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" fill="#172333" letter-spacing="-2">What we learned from riders</text>
<text x="95" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#5b6977" >A qualitative summary of the team's original 2019 survey.</text>
