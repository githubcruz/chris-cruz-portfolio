<circle cx="185" cy="634" r="25" fill="#eaf3ff" stroke="#b9d6fc" stroke-width="1.5"/>
<text x="166" y="641" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0072fc" >02</text>
