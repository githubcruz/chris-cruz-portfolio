<text x="237" y="747" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#243545" >Smell</text>
<rect x="763" y="338" width="743" height="490" rx="22" fill="#ffffff" stroke="#dce5ee" stroke-width="2"/>
<text x="805" y="403" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0072fc" letter-spacing="2">OTHER FINDINGS</text>

 <text x="805" y="449" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#607488" letter-spacing="1.3">01 / RIDER AGES</text>
 <text x="805" y="488" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#233545" >Respondents spanned a wide age range.</text>
 <line x1="805" y1="527" x2="1460" y2="527" stroke="#e7edf2" stroke-width="1.5"/>
 <text x="805" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#607488" letter-spacing="1.3">02 / TRAVEL TIME</text>
 <text x="805" y="604" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#233545" >Daytime ridership was common.</text>
 <line x1="805" y1="643" x2="1460" y2="643" stroke="#e7edf2" stroke-width="1.5"/>
 <text x="805" y="681" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#607488" letter-spacing="1.3">03 / OVERALL EXPERIENCE</text>
 <text x="805" y="720" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#233545" >Many described riding BART as average;</text>
 <text x="805" y="751" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#233545" >others reported a poor experience.</text>
